olist_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'olist') }}"
      password: "{{ env_var('PGPASSWORD', 'olist_pass') }}"
      dbname: "{{ env_var('PGDATABASE', 'olist') }}"
      schema: public
      threads: 4
      sslmode: "{{ env_var('PGSSLMODE', 'disable') }}"

