version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: olist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_pass}
      POSTGRES_DB: ${POSTGRES_DB:-olist}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: olist_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-olist}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-olist_pass}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile
    container_name: olist_ingestion
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-olist}
      PGPASSWORD: ${POSTGRES_PASSWORD:-olist_pass}
      PGDATABASE: ${POSTGRES_DB:-olist}
    volumes:
      - ../data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  dbt:
    build:
      context: ../dbt_project
      dockerfile: Dockerfile
    container_name: olist_dbt
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olist_pass}
      POSTGRES_DB: ${POSTGRES_DB:-olist}
    volumes:
      - ../dbt_project:/dbt
    working_dir: /dbt
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata:
    driver: local
